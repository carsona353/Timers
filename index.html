<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sequential Timer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111318;
    --panel: #1b1e26;
    --panel2: #242833;
    --text: #f2f4f8;
    --muted: #aeb5c2;
    --accent: #6ea8fe;
    --danger: #ff6b6b;
    --border: #353b48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap {
    width: min(900px, calc(100% - 32px));
    margin: 32px auto 48px;
  }
  h1 { margin: 0 0 8px; font-size: 2rem; }
  .subtitle { color: var(--muted); margin-bottom: 24px; }
  .current, .editor {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .current.empty { text-align: center; color: var(--muted); }
  .current-label {
    color: var(--muted);
    font-size: .9rem;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  #currentName { font-size: 1.5rem; font-weight: 650; margin-top: 4px; }
  #display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(3.5rem, 12vw, 7rem);
    font-weight: 700;
    line-height: 1;
    text-align: center;
    margin: 20px 0;
  }
  .progress {
    height: 8px;
    background: var(--panel2);
    border-radius: 99px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .15s linear;
  }
  .controls, .add-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  button {
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel2);
    color: var(--text);
    padding: 10px 15px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button.primary { background: var(--accent); color: #08101e; border-color: transparent; font-weight: 650; }
  button.danger { color: #ffd6d6; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .timer-row {
    display: grid;
    grid-template-columns: 44px minmax(130px, 1fr) 95px 95px auto;
    gap: 10px;
    align-items: center;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
  }
  .drag {
    color: var(--muted);
    cursor: grab;
    text-align: center;
    user-select: none;
    font-size: 1.2rem;
  }
  input {
    width: 100%;
    background: #14171d;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 9px 10px;
    font: inherit;
  }
  input[type="number"] { text-align: center; }
  .unit { color: var(--muted); margin-left: -4px; }
  .queue {
    margin-top: 22px;
  }
  .queue h2 { font-size: 1rem; color: var(--muted); margin: 0 0 8px; }
  .queue-item {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .queue-item:last-child { border-bottom: 0; }
  .queue-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { min-height: 1.4em; color: var(--muted); margin-top: 12px; text-align: center; }
  .small { font-size: .88rem; color: var(--muted); }
  @media (max-width: 650px) {
    .timer-row { grid-template-columns: 32px 1fr 75px 75px; }
    .timer-row button.remove { grid-column: 2 / -1; }
    .unit { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sequential Timer</h1>
  <div class="subtitle">Set up as many timers as you need. Each one starts automatically when the previous one ends.</div>

  <section class="current" id="currentPanel">
    <div class="current-label">Current timer</div>
    <div id="currentName">No timers yet</div>
    <div id="display">00:00</div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="controls">
      <button class="primary" id="startBtn">Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="resetBtn">Reset</button>
      <button id="testSoundBtn">Test sound</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="editor">
    <div id="timerList"></div>
    <div class="add-row">
      <button class="primary" id="addBtn">+ Add timer</button>
    </div>
    <div class="small" style="margin-top:14px">
      Changes are saved automatically in this browser.
    </div>
  </section>

  <section class="queue" id="queueSection">
    <h2>Up next</h2>
    <div id="queue"></div>
  </section>
</div>

<script>
(() => {
  const STORAGE_KEY = "sequentialTimerConfig_v1";

  let timers = loadTimers();
  let running = false;
  let paused = false;
  let currentIndex = 0;
  let currentRemaining = 0;
  let lastTick = null;
  let rafId = null;

  const $ = id => document.getElementById(id);
  const timerList = $("timerList");

  function defaultTimer() {
    return { name: "Timer", minutes: 5, seconds: 0 };
  }

  function loadTimers() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length) return saved.map(normalizeTimer);
    } catch {}
    return [defaultTimer()];
  }

  function normalizeTimer(t) {
    return {
      name: String(t.name ?? "Timer"),
      minutes: Math.max(0, Number(t.minutes) || 0),
      seconds: Math.min(59, Math.max(0, Number(t.seconds) || 0))
    };
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(timers));
  }

  function totalSeconds(t) {
    return Math.max(0, Number(t.minutes) * 60 + Number(t.seconds));
  }

  function formatTime(seconds) {
    seconds = Math.max(0, Math.ceil(seconds));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    if (h > 0) return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function renderEditor() {
    timerList.innerHTML = "";
    timers.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "timer-row";
      row.innerHTML = `
        <div class="drag" title="Timer order">☷</div>
        <input class="name" type="text" value="${escapeHtml(t.name)}" aria-label="Timer name">
        <input class="minutes" type="number" min="0" step="1" value="${t.minutes}" aria-label="Minutes">
        <input class="seconds" type="number" min="0" max="59" step="1" value="${t.seconds}" aria-label="Seconds">
        <button class="remove danger" type="button">Remove</button>
      `;
      const name = row.querySelector(".name");
      const mins = row.querySelector(".minutes");
      const secs = row.querySelector(".seconds");

      name.addEventListener("input", () => {
        t.name = name.value;
        save();
        renderQueue();
        if (!running && i === currentIndex) updateDisplay();
      });
      mins.addEventListener("input", () => {
        t.minutes = Math.max(0, Number(mins.value) || 0);
        save();
        if (!running && i === currentIndex) {
          currentRemaining = totalSeconds(t);
          updateDisplay();
        }
      });
      secs.addEventListener("input", () => {
        t.seconds = Math.min(59, Math.max(0, Number(secs.value) || 0));
        save();
        if (!running && i === currentIndex) {
          currentRemaining = totalSeconds(t);
          updateDisplay();
        }
      });
      row.querySelector(".remove").addEventListener("click", () => removeTimer(i));
      timerList.appendChild(row);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[c]));
  }

  function renderQueue() {
    const q = $("queue");
    q.innerHTML = "";
    if (!timers.length) {
      $("queueSection").style.display = "none";
      return;
    }
    $("queueSection").style.display = "";
    timers.slice(currentIndex + (running ? 1 : 0)).forEach((t, offset) => {
      const i = currentIndex + (running ? 1 : 0) + offset;
      const div = document.createElement("div");
      div.className = "queue-item";
      div.innerHTML = `<span>${i + 1}. ${escapeHtml(t.name || "Unnamed timer")}</span>
                       <span class="queue-time">${formatTime(totalSeconds(t))}</span>`;
      q.appendChild(div);
    });
  }

  function updateDisplay() {
    if (!timers.length) {
      $("currentName").textContent = "No timers";
      $("display").textContent = "00:00";
      $("progressBar").style.width = "0%";
      return;
    }
    const t = timers[currentIndex];
    $("currentName").textContent = t.name || "Unnamed timer";
    $("display").textContent = formatTime(currentRemaining);
    const total = totalSeconds(t);
    $("progressBar").style.width = total > 0 ? `${Math.max(0, Math.min(100, (1 - currentRemaining / total) * 100))}%` : "100%";
  }

  function initSequence() {
    if (!timers.length) return false;
    currentIndex = 0;
    currentRemaining = totalSeconds(timers[0]);
    if (currentRemaining <= 0) {
      advancePastZeroTimers();
    }
    updateDisplay();
    renderQueue();
    return true;
  }

  function start() {
    if (!timers.length) return;
    if (!running) {
      if (paused) {
        paused = false;
      } else {
        initSequence();
      }
      running = true;
      lastTick = performance.now();
      $("startBtn").disabled = true;
      $("pauseBtn").disabled = false;
      $("status").textContent = "Running";
      tick();
    } else if (paused) {
      paused = false;
      lastTick = performance.now();
      $("startBtn").disabled = true;
      $("pauseBtn").disabled = false;
      $("status").textContent = "Running";
      tick();
    }
  }

  function pause() {
    if (!running || paused) return;
    paused = true;
    $("startBtn").disabled = false;
    $("pauseBtn").disabled = true;
    $("status").textContent = "Paused";
    if (rafId) cancelAnimationFrame(rafId);
  }

  function reset() {
    running = false;
    paused = false;
    if (rafId) cancelAnimationFrame(rafId);
    currentIndex = 0;
    currentRemaining = timers.length ? totalSeconds(timers[0]) : 0;
    $("startBtn").disabled = timers.length === 0;
    $("pauseBtn").disabled = true;
    $("status").textContent = "";
    updateDisplay();
    renderQueue();
  }

  function advancePastZeroTimers() {
    while (currentIndex < timers.length && totalSeconds(timers[currentIndex]) <= 0) {
      playBeep();
      currentIndex++;
    }
    if (currentIndex >= timers.length) {
      finish();
      return false;
    }
    currentRemaining = totalSeconds(timers[currentIndex]);
    return true;
  }

  function tick(now = performance.now()) {
    if (!running || paused) return;
    const elapsed = (now - lastTick) / 1000;
    lastTick = now;
    currentRemaining -= elapsed;

    while (currentRemaining <= 0 && currentIndex < timers.length) {
      const overshoot = -currentRemaining;
      playBeep();
      currentIndex++;
      if (currentIndex >= timers.length) {
        finish();
        return;
      }
      currentRemaining = totalSeconds(timers[currentIndex]) - overshoot;
    }

    updateDisplay();
    renderQueue();
    rafId = requestAnimationFrame(tick);
  }

  function finish() {
    running = false;
    paused = false;
    currentIndex = timers.length - 1;
    currentRemaining = 0;
    updateDisplay();
    renderQueue();
    $("startBtn").disabled = false;
    $("pauseBtn").disabled = true;
    $("status").textContent = "All timers complete";
    playBeep(true);
  }

  let audioContext = null;

  function playBeep(finalBeep = false) {
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
      const now = audioContext.currentTime;
      const count = finalBeep ? 3 : 2;
      for (let i = 0; i < count; i++) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = "sine";
        osc.frequency.value = finalBeep ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, now + i * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i * 0.16 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.16 + 0.13);
        osc.connect(gain).connect(audioContext.destination);
        osc.start(now + i * 0.16);
        osc.stop(now + i * 0.16 + 0.14);
      }
    } catch (e) {
      // Sound is unavailable; timing still works.
    }
  }

  function removeTimer(i) {
    timers.splice(i, 1);
    save();
    if (!timers.length) {
      running = false;
      paused = false;
      currentIndex = 0;
      currentRemaining = 0;
    } else if (i < currentIndex) {
      currentIndex--;
    } else if (i === currentIndex && !running) {
      currentRemaining = totalSeconds(timers[currentIndex]);
    } else if (i === currentIndex && running) {
      if (currentIndex >= timers.length) finish();
      else currentRemaining = totalSeconds(timers[currentIndex]);
    }
    renderEditor();
    updateDisplay();
    renderQueue();
    $("startBtn").disabled = timers.length === 0 || running;
  }

  $("addBtn").addEventListener("click", () => {
    if (running) return;
    const n = timers.length + 1;
    timers.push({ name: `Timer ${n}`, minutes: 5, seconds: 0 });
    save();
    renderEditor();
    renderQueue();
    if (timers.length === 1) reset();
  });

  $("startBtn").addEventListener("click", () => {
    // Create/resume the AudioContext from a direct user interaction.
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      audioContext.resume();
    } catch {}
    start();
  });
  $("pauseBtn").addEventListener("click", pause);
  $("resetBtn").addEventListener("click", reset);
  $("testSoundBtn").addEventListener("click", () => playBeep());

  renderEditor();
  reset();
})();
</script>
</body>
</html>
